<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Needs | Moradabad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>🛒 Daily Needs</h1>
<p>Fast Delivery in Moradabad</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Cart</a>
<a href="#">Contact</a>
</nav>

<section class="hero">
<h2>Fresh Groceries Delivered Fast</h2>
<p>Only in Moradabad</p>
<button>Shop Now</button>
</section>

<section class="categories">
<h2>Categories</h2>
<div class="category-grid">
<div>🥔 Vegetables</div>
<div>🥟 Momos</div>
<div>🍝 Grocery</div>
<div>🥤 Snacks</div>
</div>
</section>

<section class="products">
<h2>Featured Products</h2>
<div class="product-grid">

<div class="card">
<img src="images/potato.jpg" alt="Potato">
<h3>Potato</h3>
<p>₹30/kg</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="images/onion.jpg" alt="Onion">
<h3>Onion</h3>
<p>₹40/kg</p>
<button>Add to Cart</button>
</div>

</div>
</section>

<footer>
<p>© 2026 Daily Needs - Moradabad</p>
</footer>

<script src="script.js"></script>
</body>
</html>
