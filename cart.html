<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>🛒 Your Shopping Cart</h1>
</header>

<div style="padding:20px;text-align:center;">

<h2>Your Selected Products</h2>

<div id="cart-items">
<p>Your cart is empty.</p>
</div>

<h2 id="total">Total: ₹0</h2>
<hr>

<h2>Delivery Details</h2>

<input type="text" id="name" placeholder="Full Name"><br><br>

<input type="tel" id="phone" placeholder="Mobile Number"><br><br>

<textarea id="address" placeholder="Delivery Address"></textarea><br><br>

<button onclick="placeOrder()">Place Order on WhatsApp</button>

<button onclick="checkout()">Proceed to Checkout</button>

</div>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let output = "";

let total = 0;

cart.forEach(item=>{

output += "<p>"+item.name+"</p>";

total += item.price;

});

document.addEventListener("DOMContentLoaded",()=>{

document.getElementById("cart-items").innerHTML=output;

document.getElementById("total").innerHTML="Total : ₹"+total;

});

function checkout(){

window.open("https://wa.me/917820041833?text=I want to order from Daily Needs","_blank");

}

</script>

<script src="script.js"></script>

</body>
</html>
